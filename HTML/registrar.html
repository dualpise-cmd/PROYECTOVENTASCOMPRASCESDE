<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <main class="registro">
    <section class="row justify-content-center">
       <section class="col-11 col-md-5">

        <section class="card shadow">
         <section class="card-body">
          <h1 class="h4 text-center mb-1">GESTIÓN DE VENTA Y COMPRA</h1>
          <p class="text-center text-muted mb-4">Registra un nuevo usuario</p>
        <section id="mensaje-error" class="alert alert-danger" hidden>Las contraseñas no coinciden.
        </section>
        <section id="mensaje-exito" class="alert alert-success" hidden>Usuario registrado correctamente.
        </section>

    <form id="formRegistrar">
         <section class="mb-3">
            <label for="nombreCompleto" class="form-label">Nombre completo</label>
            <input type="text" id="nombreCompleto" name="nombreCompleto" class="form-control"
             placeholder="Escribe tu nombre completo" required></section>

         <section class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" id="usuario" name="usuario" class="form-control"
             placeholder="Escribe un nombre de usuario" required></section>

         <section class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>   
            <input type="password" id="contrasena" name="contrasena" class="form-control"
             placeholder="Escribe una contraseña" required>  </section>

         <section class="mb-3">
            <label for="confirmar" class="form-label">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar" class="form-control" 
             placeholder="Repite la contraseña" required></section>

             <button type="submit" class="btn btn-success w-100">Registrar</button>
    </form>

            <a class="d-block text-center mt-3" href="Botoninicio.html">¿Ya tienes cuenta? Inicia sesión</a>
        </section>
        </section>

        </section>
        </section>
    </main>
    <script src="../JS/registrar.js"></script>
</body>
</html>
