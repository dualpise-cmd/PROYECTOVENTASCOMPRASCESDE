<!doctype html> <!-- Indica que el documento usa HTML5. -->
<html lang="es"> <!-- Declara que el idioma de la página es español. -->
<head> <!-- Inicia la configuración de la página. -->
    <meta charset="utf-8"> <!-- Permite mostrar correctamente los caracteres en español. -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Ajusta la página al ancho del dispositivo. -->
    <title>Registro | Gestión de venta y compra</title> <!-- Define el título de la pestaña. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Carga Bootstrap para el diseño responsivo. -->
</head> <!-- Termina la configuración de la página. -->
<body class="bg-light"> <!-- Inicia el contenido con un fondo claro. -->
    <main class="container py-5"> <!-- Centra el formulario y le agrega espacio alrededor. -->
        <div class="row justify-content-center"> <!-- Centra la columna del formulario. -->
            <section class="col-12 col-md-8 col-lg-6"> <!-- Cambia el ancho del formulario según el tamaño de pantalla. -->
                <div class="card border-0 shadow-sm"> <!-- Presenta el registro dentro de una tarjeta. -->
                    <div class="card-body p-4"> <!-- Agrega espacio interior a la tarjeta. -->
                        <h1 class="h3 text-center mb-2">Gestión de venta y compra</h1> <!-- Muestra el nombre del proyecto. -->
                        <p class="text-secondary text-center mb-4">Formulario de registro de muestra</p> <!-- Indica que el formulario es parte de la presentación. -->
                        <div class="alert alert-info small" role="note">En esta entrega el formulario no guarda usuarios.</div> <!-- Aclara que no hay una función de registro conectada. -->
                        <form> <!-- Agrupa los campos visibles del registro. -->
                            <div class="mb-3"> <!-- Agrupa la etiqueta y el campo del nombre. -->
                                <label for="nombreCompleto" class="form-label">Nombre completo</label> <!-- Identifica el campo del nombre completo. -->
                                <input type="text" id="nombreCompleto" class="form-control" placeholder="Escribe tu nombre completo" required> <!-- Muestra un campo de nombre adaptable de Bootstrap. -->
                            </div> <!-- Termina el grupo del nombre completo. -->
                            <div class="mb-3"> <!-- Agrupa la etiqueta y el campo del usuario. -->
                                <label for="usuario" class="form-label">Usuario</label> <!-- Identifica el campo del nombre de usuario. -->
                                <input type="text" id="usuario" class="form-control" placeholder="Escribe un nombre de usuario" required> <!-- Muestra un campo de usuario adaptable. -->
                            </div> <!-- Termina el grupo de usuario. -->
                            <div class="mb-3"> <!-- Agrupa la etiqueta y el campo de contraseña. -->
                                <label for="contrasena" class="form-label">Contraseña</label> <!-- Identifica el campo de contraseña. -->
                                <input type="password" id="contrasena" class="form-control" placeholder="Escribe una contraseña" required> <!-- Muestra un campo de contraseña. -->
                            </div> <!-- Termina el grupo de contraseña. -->
                            <div class="mb-3"> <!-- Agrupa la etiqueta y el campo de confirmación. -->
                                <label for="confirmar" class="form-label">Confirmar contraseña</label> <!-- Identifica el campo para repetir la contraseña. -->
                                <input type="password" id="confirmar" class="form-control" placeholder="Repite la contraseña" required> <!-- Muestra el campo de confirmación. -->
                            </div> <!-- Termina el grupo de confirmación. -->
                            <button type="button" class="btn btn-success w-100" disabled>Registrar</button> <!-- Deja el botón visible, pero inactivo porque no hay registro conectado. -->
                        </form> <!-- Termina el formulario visual. -->
                        <a class="d-block text-center mt-3" href="Botoninicio.html">¿Ya tienes cuenta? Inicia sesión</a> <!-- Regresa a la página de login. -->
                        <a class="d-block text-center mt-2 text-secondary" href="../index.html">Volver a la portada</a> <!-- Regresa al index.html principal de la raíz. -->
                    </div> <!-- Termina el contenido de la tarjeta. -->
                </div> <!-- Termina la tarjeta de registro. -->
            </section> <!-- Termina la columna del formulario. -->
        </div> <!-- Termina la fila centrada. -->
    </main> <!-- Termina el contenido principal. -->
</body> <!-- Termina el contenido visible. -->
</html> <!-- Termina el documento HTML. -->
