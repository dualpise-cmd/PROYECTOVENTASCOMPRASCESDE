        <!doctype html>
        <html lang="es">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Panel | Gestión de venta y compra</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
            <link rel="stylesheet" href="../CSS/style_panel.css">
        </head>
        <body class="bg-light">
            <header> <!-- Contiene el logo y los controles principales. -->
                <nav class="navbar encabezado-panel" data-bs-theme="dark">
                    <section class="container-fluid">
                            <img class="logo-panel" src="../IMAGENES/Captura de pantalla 2026-09-28 111203.png" alt="Logo ControlZ">
                        <section class="d-flex align-items-center ms-auto">
                            <a class="btn btn-light btn-md rounded-pill" href="../index.html">Cerrar Sesión</a>
                            <button class="navbar-toggler ms-5 d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menú">
                                <span class="navbar-toggler-icon"></span>
                            </button>
                        </section>
                    </section>
                </nav>
            </header>

            <section class="d-flex flex-column flex-lg-row">
                <nav class="offcanvas-lg offcanvas-start menu-lateral" tabindex="-1" id="menuLateral" aria-label="Menú del sistema"> <!-- Crea un menú lateral que se vuelve desplegable en pantallas pequeñas. -->
                    <section class="offcanvas-header d-lg-none">
                        <h2 class="offcanvas-title fs-5">Menú del sistema</h2>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar menú"></button>
                    </section>
                    <section class="offcanvas-body d-flex flex-column p-0">
                        <p class="menu-titulo px-3 py-3 mb-0">Menú principal</p>
                        <section class="accordion accordion-flush" id="acordeonMenu">
                            <section class="accordion-item menu-grupo"> <!-- Categoría de datos maestros. -->
                                <h2 class="accordion-header">
                                    <button class="accordion-button menu-categoria" type="button" data-bs-toggle="collapse" data-bs-target="#submenuMaestros" aria-expanded="true" aria-controls="submenuMaestros">Datos Maestros</button>
                                </h2>
                                <section id="submenuMaestros" class="accordion-collapse collapse show" data-bs-parent="#acordeonMenu">
                                    <section class="list-group list-group-flush">
                                        <button class="list-group-item list-group-item-action menu-opcion" type="button" data-bs-toggle="modal" data-bs-target="#modal-tarifas">Tarifas de impuesto</button>
                                        <button class="list-group-item list-group-item-action menu-opcion" type="button" data-bs-toggle="modal" data-bs-target="#modal-tercero">Terceros</button>
                                        <button class="list-group-item list-group-item-action menu-opcion" type="button" data-bs-toggle="modal" data-bs-target="#modal-producto">Productos</button>
                                    </section>
                                </section>
                            </section>
                            <section class="accordion-item menu-grupo"> <!-- Categoría de movimientos. -->
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed menu-categoria" type="button" data-bs-toggle="collapse" data-bs-target="#submenuMovimientos" aria-expanded="false" aria-controls="submenuMovimientos">Movimientos</button>
                                </h2>
                                <section id="submenuMovimientos" class="accordion-collapse collapse" data-bs-parent="#acordeonMenu">
                                    <section class="list-group list-group-flush">
                                        <button class="list-group-item list-group-item-action menu-opcion" type="button" data-bs-toggle="modal" data-bs-target="#modal-pendiente">Registrar compra</button>
                                        <button class="list-group-item list-group-item-action menu-opcion" type="button" data-bs-toggle="modal" data-bs-target="#modal-pendiente">Registrar venta</button>
                                    </section>
                                </section>
                            </section>
                            <section class="accordion-item menu-grupo"> <!-- Categoría de informes. -->
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed menu-categoria" type="button" data-bs-toggle="collapse" data-bs-target="#submenuInformes" aria-expanded="false" aria-controls="submenuInformes">Informes</button>
                                </h2>
                                <section id="submenuInformes" class="accordion-collapse collapse" data-bs-parent="#acordeonMenu">
                                    <section class="list-group list-group-flush">
                                        <button class="list-group-item list-group-item-action menu-opcion" type="button" data-bs-toggle="modal" data-bs-target="#modal-informesmaestros">Informes de datos maestros</button>
                                        <button class="list-group-item list-group-item-action menu-opcion" type="button" data-bs-toggle="modal" data-bs-target="#modal-pendiente">Informes de compras y ventas</button>
                                    </section>
                                </section>
                            </section>
                            <button class="btn menu-acceso" type="button" data-bs-toggle="modal" data-bs-target="#modal-pendiente">Configuración</button>
                            <button class="btn menu-acceso" type="button" data-bs-toggle="modal" data-bs-target="#modal-pendiente">Soporte</button>
                        </section>
                    </section>
                </nav>

        <main class="fondo-panel flex-grow-1" aria-label="Área principal de trabajo"> <!-- Deja visible el fondo hasta que se seleccione una opción del menú. -->
            <section class="modal fade" id="modal-tarifas" tabindex="-1" aria-labelledby="tituloModalTarifas" aria-hidden="true"> <!-- Ventana con el formulario de tarifas. -->
                <section class="modal-dialog modal-dialog-scrollable">
                    <section class="modal-content"> 
                        <section class="modal-header">
                            <h2 class="modal-title fs-5" id="tituloModalTarifas">Tarifas de impuesto</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </section>
                        <section class="modal-body">
                            <form>
                                <section class="mb-3">
                                    <label class="form-label" for="descripcionTarifa">Descripcion</label>
                                    <input class="form-control" type="text" id="Descripcion" required>
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="porcentaje">Porcentaje de impuesto</label>
                                    <select class="form-select" id="Porcentaje" required type="number">
                                        <option value="">Seleccionar porcentaje del impuesto</option>
                                        <option value="1">0%</option>
                                        <option value="2">5%</option>
                                        <option value="3">19%</option>
                                    </select>
                                </section>
                            </form>
                        </section>
                        <section class="modal-footer">
                            <button type="button" class="btn btn-cerrar" data-bs-dismiss="modal">Cerrar</button>
                            <button type="button" class="btn btn-guardar">Guardar tarifa de impuesto</button>
                        </section>
                    </section>
                </section>
            </section>

            <section class="modal fade" id="modal-tercero" tabindex="-1" aria-labelledby="tituloModalTercero" aria-hidden="true"> <!-- Ventana con el formulario de tercero. -->
                <section class="modal-dialog modal-dialog-scrollable">
                    <section class="modal-content"> 
                        <section class="modal-header">
                            <h2 class="modal-title fs-5" id="tituloModalTercero">Crear tercero</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </section>
                        <section class="modal-body">
                            <form>
                                 <section class="mb-3">
                                    <label class="form-label" for="tipoDocumento">Tipo de documento</label>
                                    <select class="form-select" id="TipoDocumento" required>
                                     <option value="">Seleccionar tipo de documento</option>
                                     <option value="CC">Cédula de ciudadania</option>
                                     <option value="NIT">NIT de empresa</option>
                                     <option value="OTRO">Otro</option>
                                    </select>
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="documento">Número de documento</label>
                                    <input class="form-control" type="number" id="Documento" required>
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="razSocial">Razón social</label>
                                    <input class="form-control" type="text" id="RazonSocial">
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="nombres">Nombres</label>
                                    <input class="form-control" type="text" id="Nombres">
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="apellidos">Apellidos</label>
                                    <input class="form-control" type="text" id="Apellidos">
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="telefono">Teléfono</label>
                                    <input class="form-control" type="number" id="telefono">
                                </section>
                                <fieldset class=" border rounded p-3 mt-3">
                                    <legend class="w-auto px-2 fs-6 fw-semibold mb-2">Tipo de tercero</legend>
                                    <section class="form-check">
                                        <input class="form-check-input" type="checkbox" id="EsCliente">
                                        <label class="form-check-label" for="EsCliente">Cliente</label>
                                    </section>
                                    <section class="form-check">
                                        <input class="form-check-input" type="checkbox" id="EsProveedor">
                                        <label class="form-check-label" for="EsProveedor">Proveedor</label>
                                    </section>
                                </fieldset>
                            </form>
                        </section>
                        <section class="modal-footer">
                            <button type="button" class="btn btn-cerrar" data-bs-dismiss="modal">Cerrar</button>
                            <button type="button" class="btn btn-guardar">Guardar tercero</button>
                        </section>
                    </section>
                </section>
            </section>

            <section class="modal fade" id="modal-producto" tabindex="-1" aria-labelledby="tituloModalProducto" aria-hidden="true"> <!-- Ventana con el formulario de producto. -->
                <section class="modal-dialog">
                    <section class="modal-content">
                        <section class="modal-header">
                            <h2 class="modal-title fs-5" id="tituloModalProducto">Crear producto</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </section>
                        <section class="modal-body">
                            <form>
                                <section class="mb-3">
                                    <label class="form-label" for="codigo">Código</label>
                                    <input class="form-control" type="text" id="codigo" required>
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="nombreProducto">Nombre del producto</label>
                                    <input class="form-control" type="text" id="nombreProducto" required>
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="precio">Precio de venta</label>
                                    <input class="form-control" type="number" id="precio" min="0" required>
                                </section>
                                <section class="mb-3">
                                    <label class="form-label" for="iva">IVA</label>
                                    <select class="form-select" id="iva">
                                        <option value="">Seleccione una tarifa de IVA</option>
                                        <option value="0">0%</option>
                                        <option value="5">5%</option>
                                        <option value="19">19%</option>
                                    </select>
                                </section>
                            </form>
                        </section>
                        <section class="modal-footer">
                            <button type="button" class="btn btn-cerrar" data-bs-dismiss="modal">Cerrar</button>
                            <button type="button" class="btn btn-guardar">Guardar producto</button>
                        </section>  
                    </section>
                </section>
            </section>

            <section class="modal fade" id="modal-informesmaestros" tabindex="-1" aria-labelledby="tituloModalInforme" aria-hidden="true"> <!-- Ventana para seleccionar un informe de datos maestros. -->
                <section class="modal-dialog">
                    <section class="modal-content">
                        <section class="modal-header">
                            <h2 class="modal-title fs-5" id="tituloModalInforme">Informes de control</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </section>
                        <section class="modal-body">
                            <p class="small text-secondary">Selección visual de informe; no se genera un archivo en esta entrega.</p>
                            <label class="form-label" for="tipoInforme">Tipo de informe</label>
                            <select class="form-select" id="tipoInforme">
                                <option value="">Seleccione un tipo de informe</option>
                                <option value="clientes">Informe de clientes</option>
                                <option value="proveedores">Informe de proveedores</option>
                                <option value="productos">Informe de productos</option>
                            </select>
                        </section>
                        <section class="modal-footer">
                            <button type="button" class="btn btn-cerrar" data-bs-dismiss="modal">Cerrar</button>
                            <button type="button" class="btn btn-guardar">Generar informe</button>
                        </section>  
                    </section>
                </section>
            </section>
        </main>
        </section>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
