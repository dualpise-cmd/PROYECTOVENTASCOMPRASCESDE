<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar clave | Gestión de venta y compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style_recuperar.css">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4"> <!-- Centra el formulario en la pantalla. -->
        <section class="card login-caja border-0 shadow-sm w-100"> <!-- Presenta la recuperación dentro de una tarjeta adaptable. -->
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 text-center mb-2">Recuperar clave</h1>
                <p class="text-secondary text-center mb-4">Escribe tu nombre de usuario</p>
                <div class="alert alert-info small" role="note">Esta opción es solo de presentación. No envía ni cambia claves en esta entrega.</div>
                <form>
                    <div class="mb-3">
                        <label class="form-label" for="usuarioRecuperacion">Usuario</label>
                        <input class="form-control" type="text" id="usuarioRecuperacion" placeholder="Escribe tu usuario" autocomplete="username" required>
                    </div>
                    <button class="btn btn-success w-100" type="button" disabled>Recuperar clave</button>
                </form>
                <a class="d-block text-center mt-3" href="login.html">Volver al login</a>
                <a class="d-block text-center mt-2 text-secondary" href="../index.html">Volver a la portada</a>
            </div>
        </section>
    </main>
</body>
</html>
