<!DOCTYPE html>
<html lang="es">

 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>GESTIÓN DE VENTA Y COMPRA</title>
 </head>

  <body>
     <section class="encabezado">
        <section class="contenido-encabezado">
            <section class="contenedor-logo">
                <img src="../IMAGENES/Captura de pantalla 2026-09-28 111203.png" alt="Logo de la empresa">
            </section>
            <h1 class="titulo-principal">GESTIÓN DE VENTA Y COMPRA</h1>
            <button class="boton-salir" onclick="cerrarSesion()">Cerrar sesión</button>
        </section>
     </section>
      <main class="pagina-principal">

        <section class="tarjetas-datos">
            <section class="tarjeta-dato">
                <section class="contenido-tarjeta">
                    <section class="titulo-tarjeta"> COMPRAS DEL DIA</section>
                    <section class="valor-tarjeta">$0</section>
                </section>
            </section>
            <section class="tarjeta-dato">
                <section class="contenido-tarjeta"> 
                    <section class="titulo-tarjeta">VENTAS DEL DIA</section>
                    <section class="valor-tarjeta">$0</section> 
                </section>
            </section>  
            <section class="tarjeta-dato">
                <section class="contenido-tarjeta">
                    <section class="titulo-tarjeta">UTILIDAD DEL DIA</section>
                    <section class="valor-tarjeta">$0</section>
                </section>
            </section>
        </section>

        <section class="cuadricula-modulos">
            
            <section class="tarjeta-modulo">
                <section class="encabezado-modulo">
                    <h4> DATOS MAESTROS</h4>
                </section>
                <section class="modulo-contenido">
                    <button class="boton-accion" type="button">CREAR TERCERO</button>
                    <button class="boton-accion" type="button">CREAR PRODUCTO</button>
                    <button class="boton-accion" type="button">INFORMES DE CONTROL</button>
                </section>
            </section>
            <section class="tarjeta-modulo">
                <section class="encabezado-modulo">
                    <h4> MODULO INVENTARIOS</h4>
                </section>
                <section class="modulo-contenido">
                    <button class="boton-accion" type="button">REGISTRAR COMPRA</button>
                    <button class="boton-accion" type="button">CONSULTAR STOCK ACTUALIZADO</button>
                    <button class="boton-accion" type="button">INFORMES DE CONTROL</button>
                </section>
            </section>
            <section class="tarjeta-modulo">
                <section class="encabezado-modulo">
                    <h4> MODULO VENTAS</h4>
                </section>
                <section class="modulo-contenido">
                    <button class="boton-accion" type="button">REGISTRAR VENTA</button>
                    <button class="boton-accion" type="button">VENTAS DEL DIA</button>
                    <button class="boton-accion" type="button">INFORMES DE CONTROL</button>
                </section>
            </section>
        </section>

     </main>

   </body>

</html>
