<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GESTIÓN DE VENTA Y COMPRA</title>
    <link rel="stylesheet" href="../CSS/Style_botoninicio.css">
</head>
<body>
    <section class="box">
        <img src="../IMAGENES/inicio2.png" alt="Marca de agua">
        
    </section>
    <main class="login-caja">
        <h1>GESTIÓN DE VENTA Y COMPRA</h1>
        <p class="subtitulo">Inicia sesión para continuar</p>

        <p id="mensaje-error" class="error" hidden>Usuario o contraseña incorrectos.</p>
        <p id="mensaje-exito" class="exito" hidden>Acceso correcto. Bienvenido.</p>

        <form id="formLogin">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario"
                   placeholder="Escribe tu usuario" required autofocus>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena"
                   placeholder="Escribe tu contraseña" required>

            <button type="submit" id="btnIngresar" class="btn-ingresar">Ingresar</button>
        </form>

        <a class="enlace-registrar" href="registrar.html">Registrar usuario</a>
    </main>

    <script src="../JS/iniciarSesion.js"></script>
</body>
</html>
