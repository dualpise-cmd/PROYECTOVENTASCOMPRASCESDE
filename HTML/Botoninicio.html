<!doctype html> <!-- Indica que el documento usa HTML5. -->
<html lang="es"> <!-- Declara que el idioma de la página es español. -->
<head> <!-- Inicia la configuración de la página. -->
    <meta charset="utf-8"> <!-- Permite mostrar correctamente las tildes y la ñ. -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Hace que el diseño se ajuste a celulares. -->
    <title>Login | Gestión de venta y compra</title> <!-- Define el título de la pestaña. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Carga los estilos responsivos de Bootstrap. -->
    <link rel="stylesheet" href="../CSS/Style_botoninicio.css"> <!-- Carga los estilos propios de la pantalla. -->
</head> <!-- Termina la configuración de la página. -->
<body class="bg-light"> <!-- Inicia la página con un fondo claro de Bootstrap. -->
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4"> <!-- Centra el formulario y permite que se adapte a distintas pantallas. -->
        <section class="card login-caja border-0 shadow-sm w-100"> <!-- Presenta el formulario dentro de una tarjeta. -->
            <div class="card-body p-4 p-md-5"> <!-- Agrega espacio interior, mayor en pantallas medianas. -->
                <h1 class="h3 text-center mb-2">Gestión de venta y compra</h1> <!-- Muestra el nombre del proyecto. -->
                <p class="text-secondary text-center mb-4">Inicia sesión para continuar</p> <!-- Explica para qué sirve el formulario. -->
                <div class="alert alert-info small" role="note">Esta pantalla es una demostración: no valida usuarios ni guarda información.</div> <!-- Aclara el alcance de esta entrega académica. -->
                <form action="panel.html" method="get"> <!-- Al enviar los campos completos, abre el panel de trabajo que está en esta misma carpeta. -->
                    <div class="mb-3"> <!-- Agrupa la etiqueta y el campo de usuario. -->
                        <label for="usuario" class="form-label">Usuario</label> <!-- Asocia el texto visible con el campo de usuario. -->
                        <input type="text" id="usuario" class="form-control" placeholder="Escribe tu usuario" autocomplete="username" required autofocus> <!-- El navegador exige que el campo no esté vacío; no se envía su contenido. -->
                    </div> <!-- Termina el grupo de usuario. -->
                    <div class="mb-3"> <!-- Agrupa la etiqueta y el campo de contraseña. -->
                        <label for="contrasena" class="form-label">Contraseña</label> <!-- Asocia el texto visible con el campo de contraseña. -->
                        <input type="password" id="contrasena" class="form-control" placeholder="Escribe tu contraseña" autocomplete="current-password" required> <!-- El navegador exige que el campo no esté vacío; no se envía su contenido. -->
                    </div> <!-- Termina el grupo de contraseña. -->
                    <button type="submit" class="btn btn-success w-100">Ingresar</button> <!-- Envía el formulario y abre HTML/panel.html. -->
                </form> <!-- Termina el formulario de ingreso. -->
                <a class="d-block text-center mt-3" href="recuperar.html">¿Olvidaste tu contraseña?</a> <!-- Abre el formulario para escribir el nombre de usuario. -->
                <a class="d-block text-center mt-2 text-secondary" href="../index.html">Volver a la portada</a> <!-- Regresa al index.html de la raíz del proyecto. -->
            </div> <!-- Termina el contenido de la tarjeta. -->
        </section> <!-- Termina la tarjeta de ingreso. -->
    </main> <!-- Termina el contenido principal. -->
</body> <!-- Termina el contenido visible de la página. -->
</html> <!-- Termina el documento HTML. -->
