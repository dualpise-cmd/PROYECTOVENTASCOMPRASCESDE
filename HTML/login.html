<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Gestión de venta y compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style_login.css">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4"> <!-- Centra el formulario y permite que se adapte a distintas pantallas. -->
        <section class="card login-caja border-5 shadow-lg border-success w-100"> <!-- Presenta el formulario dentro de una tarjeta. -->
            <section class="card-body p-5 p-md-5">
                <h1 class="h3 text-center mb-2">Gestión de venta y compra</h1>
                <p class="text-secondary text-center mb-4">Inicia sesión para continuar</p>
                <form action="panel.html" method="get">
                    <section class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" id="usuario" class="form-control" placeholder="Escribe tu usuario" autocomplete="username" required autofocus>
                    </section>
                    <section class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" id="contrasena" class="form-control" placeholder="Escribe tu contraseña" autocomplete="current-password" required>
                    </section>
                    <button type="submit" class="btn btn-success w-100">Ingresar</button>
                </form>
                <a class="d-block text-center mt-3" href="recuperar.html">¿Olvidaste tu contraseña?</a>
                <a class="d-block text-center mt-2 text-secondary" href="../index.html">Volver a la portada</a>
            </section>
        </section>
    </main>
</body>
</html>
